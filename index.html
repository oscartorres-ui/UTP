<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditor Pedagógico UTP - Colegio Isabel Riquelme</title>
  
  <!-- Renderizador de Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- Generador de PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --primary: #6b21a8;
      --accent: #00c4cc;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px 15px; }
    .card { background: var(--card-bg); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); max-width: 850px; margin: 0 auto; }
    
    .header-title { text-align: center; margin-bottom: 20px; }
    .header-title h2 { color: var(--primary); margin: 0 0 6px 0; }
    .header-title p { color: #64748b; margin: 0; font-size: 0.9rem; }

    .input-group { margin-bottom: 20px; }
    label.input-label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: #334155; }
    
    .api-input-wrapper { position: relative; display: flex; align-items: center; }
    .api-input-wrapper input {
      width: 100%; padding: 12px 40px 12px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; background: #fff;
    }
    .api-input-wrapper button.toggle-pwd { position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: #64748b; font-size: 1.1rem; }
    
    .grid-files { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    @media (max-width: 640px) { .grid-files { grid-template-columns: 1fr; } }
    
    .file-box { background: #f8fafc; border: 2px dashed #cbd5e1; padding: 16px; border-radius: 12px; }
    .file-box label { font-weight: 700; font-size: 0.9rem; color: #1e293b; display: block; margin-bottom: 4px; }
    .file-box .sub { font-size: 0.78rem; color: #64748b; margin-bottom: 12px; }
    
    input[type="file"] { display: block; width: 100%; padding: 8px; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.85rem; }
    
    button.btn-main {
      width: 100%; background: linear-gradient(135deg, #7e22ce, #6b21a8);
      color: white; border: none; padding: 14px; font-size: 1rem; font-weight: 700; border-radius: 10px; cursor: pointer;
      transition: all 0.2s ease;
    }
    button.btn-main:disabled { background: #cbd5e0; cursor: not-allowed; }
    
    #errorBox { display: none; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 14px 16px; border-radius: 10px; margin-bottom: 15px; font-size: 0.88rem; word-break: break-word; line-height: 1.4; white-space: pre-wrap; }
    
    #statusBox { display: none; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 14px; border-radius: 10px; margin-bottom: 15px; font-size: 0.85rem; font-family: monospace; line-height: 1.5; white-space: pre-wrap; }

    #loader { display: none; text-align: center; padding: 20px; font-weight: 600; color: #6b21a8; }
    .spinner { display: inline-block; width: 22px; height: 22px; border: 3px solid #e9d5ff; border-top-color: #6b21a8; border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    #results { margin-top: 25px; display: none; background: #ffffff; padding: 24px; border-radius: 12px; border-top: 4px solid var(--accent); }
    
    .action-bar { display: flex; justify-content: flex-end; margin-bottom: 20px; }
    .btn-download { background: #16a34a; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    .btn-download:hover { background: #15803d; }
    
    #reporteContenido { line-height: 1.6; color: #1e293b; }
    #reporteContenido h1, #reporteContenido h2, #reporteContenido h3 { color: #6b21a8; margin-top: 20px; }
    #reporteContenido table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 0.85rem; }
    #reporteContenido th, #reporteContenido td { border: 1px solid #e2e8f0; padding: 8px; text-align: left; }
    #reporteContenido th { background-color: #f7fafc; color: #2d3748; }
  </style>
</head>
<body>

<div class="card">
  <div class="header-title">
    <h2>Auditor Pedagógico UTP</h2>
    <p>Colegio Particular Subvencionado Isabel Riquelme (La Serena)</p>
  </div>

  <div class="input-group">
    <label class="input-label" for="apiKey">Clave API de Gemini:</label>
    <div class="api-input-wrapper">
      <input type="password" id="apiKey" placeholder="Pega aquí tu API Key de Google AI Studio">
      <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility()">👁</button>
    </div>
  </div>

  <div class="grid-files">
    <div class="file-box">
      <label>1. Tabla de Especificaciones</label>
      <div class="sub">PDF con la matriz de especificaciones entregada por el docente.</div>
      <input type="file" id="tablaPdf" accept="application/pdf">
    </div>

    <div class="file-box">
      <label>2. Evaluación o Prueba</label>
      <div class="sub">PDF del instrumento de evaluación del estudiante.</div>
      <input type="file" id="pruebaPdf" accept="application/pdf">
    </div>
  </div>

  <div id="errorBox"></div>
  <div id="statusBox"></div>

  <button class="btn-main" id="btnAnalizar" onclick="ejecutarAuditoria()">
    ✨ Auditar evaluación pedagógica
  </button>

  <div id="loader">
    <div class="spinner"></div>
    <span id="loaderText">Procesando...</span>
  </div>

  <div id="results">
    <div class="action-bar">
      <button class="btn-download" onclick="descargarInformePDF()">
        📥 Descargar Informe PDF
      </button>
    </div>
    <div id="reporteContenido"></div>
  </div>
</div>

<script>
  function togglePasswordVisibility() {
    const input = document.getElementById('apiKey');
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  function logStatus(msg) {
    const statusBox = document.getElementById('statusBox');
    statusBox.style.display = 'block';
    statusBox.innerText += msg + '\n';
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      if (!file) {
        reject(new Error('Archivo no encontrado.'));
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const res = reader.result;
          if (typeof res === 'string' && res.includes(',')) {
            resolve(res.split(',')[1]);
          } else {
            reject(new Error('Respuesta de lectura de archivo no válida.'));
          }
        } catch (e) {
          reject(e);
        }
      };
      reader.onerror = (err) => reject(err || new Error('Error al leer el PDF.'));
      reader.readAsDataURL(file);
    });
  }

  function descargarInformePDF() {
    const elemento = document.getElementById('reporteContenido');
    if (!elemento || !elemento.innerText.trim()) return;

    const opciones = {
      margin:       [12, 12, 12, 12],
      filename:     'Informe_Auditoria_Pedagogica_UTP.pdf',
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, useCORS: true },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(opciones).from(elemento).save();
  }

  // PAUTA INSTITUCIONAL Y SYSTEM INSTRUCTIONS
  const SYSTEM_INSTRUCTIONS = `Eres un Asesor Pedagógico Experto y Auditor Técnico de la UTP del Colegio Particular Subvencionado Isabel Riquelme (La Serena), guiado por el Marco para la Buena Enseñanza (MBE / MINEDUC de Chile).

Tu tarea es auditar técnicamente la Evaluación y la Tabla de Especificaciones adjuntas, verificando si cumplen estricta y fielmente con la PAUTA INSTITUCIONAL DE EVALUACIÓN DEL COLEGIO ISABEL RIQUELME.

--- PAUTA TÉCNICA E INSTITUCIONAL DE EVALUACIÓN (CRITERIOS DE AUDITORÍA) ---

1. COBERTURA Y REQUISITOS GENERALES:
   - Objetivos de Aprendizaje (OA): Máximo 3 Objetivos de Aprendizaje evaluados en el instrumento.
   - Habilidades Evaluadas: Obligatoriamente 3 niveles de habilidad declarados y evaluados.

2. GRADUACIÓN COGNITIVA Y DISTRIBUCIÓN DE PONDERACIÓN:
   - Nivel I (Conocer / Recordar - Habilidad Básica): Representa aprox. el 25% del puntaje (Preguntas de 1 punto).
   - Nivel II (Comprender / Aplicar - Habilidad Intermedia): Representa aprox. el 25% del puntaje (Preguntas de 1 punto).
   - Nivel III (Analizar / Evaluar - Habilidad Avanzada): Representa aprox. el 50% del puntaje (Preguntas o ítems complejos de 2 puntos).

3. ESTRUCTURA DE ÍTEMS Y FORMATO INSTITUCIONAL:
   - Preguntas de Selección Múltiple: Deben contar con exactamente 3 alternativas (a, b, c) para mantener homogeneidad y evitar sobrecarga cognitiva.
   - Preguntas de Desarrollo Corto: Deben ser abiertas, enfocadas en habilidades superiores (Analizar/Evaluar) e incluir suficiente espacio de respuesta.
   - Rúbrica Analítica para Desarrollo: Las preguntas abiertas deben contar con una Rúbrica Analítica explícita con niveles de Logrado (2 pts), Medianamente Logrado (1 pt) y No Logrado (0 pts).

4. CONCORDANCIA Y COHERENCIA INTERNA:
   - Correspondencia Exacta: El número de ítems, tipo de pregunta, habilidad, indicador de logro y puntaje asignado en la Prueba deben coincidir al 100% con lo registrado en la Tabla de Especificaciones.
   - Redacción de Indicadores: Los indicadores de logro deben redactarse con verbos observables y precisos.

--- ESTRUCTURA OBLIGATORIA DEL INFORME DE AUDITORÍA A GENERAR ---

1. DICTAMEN DE AUDITORÍA: Declarar claramente si el instrumento está "APROBADO", "APROBADO CON OBSERVACIONES" o "RECHAZADO PARA CORRECCIÓN".
2. TABLA DE CUMPLIMIENTO INSTITUCIONAL:
   - Evaluar con (Cumple / Cumple Parcialmente / No Cumple) los puntos:
     a) Límite de 3 OA.
     b) Presencia de 3 Habilidades.
     c) Balance Cognitivo 25% / 25% / 50%.
     d) Preguntas con 3 alternativas (a, b, c).
     e) Inclusión de Rúbrica Analítica para Desarrollo.
     f) Concordancia 100% Prueba vs. Tabla de Especificaciones.
3. ANÁLISIS DETALLADO DE OBSERVACIONES TÉCNICAS.
4. CARTA FORMATIVA DE RETROALIMENTACIÓN PARA EL DOCENTE (Redactada con tono constructivo, profesional y orientador).`;

  async function ejecutarAuditoria() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const tablaFile = document.getElementById('tablaPdf').files[0];
    const pruebaFile = document.getElementById('pruebaPdf').files[0];
    const errorBox = document.getElementById('errorBox');
    const statusBox = document.getElementById('statusBox');
    const loaderText = document.getElementById('loaderText');

    errorBox.style.display = 'none';
    statusBox.style.display = 'none';
    statusBox.innerText = '';

    if (!apiKey) {
      errorBox.innerText = '⚠️ Debes ingresar tu Clave API de Gemini.';
      errorBox.style.display = 'block';
      return;
    }

    if (!tablaFile || !pruebaFile) {
      errorBox.innerText = '⚠️ Debes seleccionar ambos archivos PDF (Tabla de Especificaciones y Evaluación).';
      errorBox.style.display = 'block';
      return;
    }

    if (tablaFile.size > 15 * 1024 * 1024 || pruebaFile.size > 15 * 1024 * 1024) {
      errorBox.innerText = '⚠️ Uno de los archivos PDF supera los 15MB. Utiliza archivos de menor peso.';
      errorBox.style.display = 'block';
      return;
    }

    document.getElementById('btnAnalizar').disabled = true;
    document.getElementById('loader').style.display = 'block';
    document.getElementById('results').style.display = 'none';

    try {
      logStatus(`[1/4] Convirtiendo Tabla (${(tablaFile.size / 1024).toFixed(1)} KB)...`);
      loaderText.innerText = 'Leyendo Tabla de Especificaciones...';
      const tablaB64 = await fileToBase64(tablaFile);

      logStatus(`[2/4] Convirtiendo Evaluación (${(pruebaFile.size / 1024).toFixed(1)} KB)...`);
      loaderText.innerText = 'Leyendo Evaluación...';
      const pruebaB64 = await fileToBase64(pruebaFile);

      logStatus('[3/4] Conectando con la API de Gemini...');

      const modelos = ['gemini-3.8-flash', 'gemini-3.7-flash', 'gemini-3.6-flash'];
      let data = null;
      let erroresAcumulados = [];

      for (const model of modelos) {
        logStatus(`Consultando modelo activo: ${model}...`);
        loaderText.innerText = `Procesando con ${model}...`;

        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 60000);

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: controller.signal,
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: SYSTEM_INSTRUCTIONS + "\n\nRealiza la auditoría pedagógica según la Pauta Institucional cruzando los documentos adjuntos." },
                  { inlineData: { mimeType: "application/pdf", data: tablaB64 } },
                  { inlineData: { mimeType: "application/pdf", data: pruebaB64 } }
                ]
              }]
            })
          });

          clearTimeout(timeoutId);

          const json = await response.json();
          if (response.ok && json.candidates && json.candidates[0]?.content?.parts[0]?.text) {
            data = json;
            logStatus(`✅ Conexión exitosa con ${model}`);
            break;
          } else {
            const errDetail = json.error ? json.error.message : 'HTTP ' + response.status;
            erroresAcumulados.push(`[${model}]: ${errDetail}`);
            logStatus(`⚠️ Respuesta de ${model}: ${errDetail}`);
          }
        } catch (e) {
          const msg = e.name === 'AbortError' ? 'Tiempo de espera agotado (60s)' : e.message;
          erroresAcumulados.push(`[${model}]: ${msg}`);
          logStatus(`⚠️ Falló conexión con ${model}: ${msg}`);
        }
      }

      if (!data) {
        throw new Error('No se pudo obtener respuesta de la API de Gemini:\n' + erroresAcumulados.join('\n'));
      }

      logStatus('[4/4] Generando informe pedagógico...');
      loaderText.innerText = 'Renderizando informe...';

      const textoResultado = data.candidates[0].content.parts[0].text;

      if (window.marked) {
        document.getElementById('reporteContenido').innerHTML = marked.parse(textoResultado);
      } else {
        document.getElementById('reporteContenido').innerText = textoResultado;
      }

      document.getElementById('results').style.display = 'block';

    } catch (err) {
      errorBox.innerText = '❌ Error durante la auditoría:\n' + err.message;
      errorBox.style.display = 'block';
    } finally {
      document.getElementById('btnAnalizar').disabled = false;
      document.getElementById('loader').style.display = 'none';
    }
  }
</script>
</body>
</html>
