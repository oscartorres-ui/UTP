<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditor Pedagógico UTP - Colegio Isabel Riquelme</title>
  
  <!-- Renderizador de Markdown para formatear los informes -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- Librería para generar y descargar el PDF directamente -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --primary: #6b21a8;
      --accent: #00c4cc;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px 15px; }
    .card { background: var(--card-bg); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); max-width: 820px; margin: 0 auto; }
    
    .header-title { text-align: center; margin-bottom: 20px; }
    .header-title h2 { color: var(--primary); margin: 0 0 6px 0; }
    .header-title p { color: #64748b; margin: 0; font-size: 0.9rem; }

    .input-group { margin-bottom: 20px; }
    label.input-label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: #334155; }
    
    .api-input-wrapper { position: relative; display: flex; align-items: center; }
    .api-input-wrapper input {
      width: 100%; padding: 12px 40px 12px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; background: #fff;
    }
    .api-input-wrapper button.toggle-pwd { position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: #64748b; font-size: 1.1rem; }
    
    .grid-files { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    @media (max-width: 640px) { .grid-files { grid-template-columns: 1fr; } }
    
    .file-box { background: #f8fafc; border: 2px dashed #cbd5e1; padding: 16px; border-radius: 12px; }
    .file-box label { font-weight: 700; font-size: 0.9rem; color: #1e293b; display: block; margin-bottom: 4px; }
    .file-box .sub { font-size: 0.78rem; color: #64748b; margin-bottom: 12px; }
    
    input[type="file"] { display: block; width: 100%; padding: 8px; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.85rem; }
    
    button.btn-main {
      width: 100%; background: linear-gradient(135deg, #7e22ce, #6b21a8);
      color: white; border: none; padding: 14px; font-size: 1rem; font-weight: 700; border-radius: 10px; cursor: pointer;
    }
    button.btn-main:disabled { background: #cbd5e0; cursor: not-allowed; }
    
    #errorBox { display: none; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 12px 16px; border-radius: 10px; margin-bottom: 15px; font-size: 0.88rem; }
    #loader { display: none; text-align: center; padding: 25px; font-weight: 600; color: #6b21a8; }
    
    #results { margin-top: 25px; display: none; background: #ffffff; padding: 24px; border-radius: 12px; border-top: 4px solid var(--accent); }
    
    .action-bar { display: flex; justify-content: flex-end; margin-bottom: 20px; }
    .btn-download { background: #16a34a; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    .btn-download:hover { background: #15803d; }
    
    #reporteContenido { line-height: 1.6; color: #1e293b; }
    #reporteContenido h1, #reporteContenido h2, #reporteContenido h3 { color: #6b21a8; margin-top: 20px; }
    #reporteContenido table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 0.85rem; }
    #reporteContenido th, #reporteContenido td { border: 1px solid #e2e8f0; padding: 8px; text-align: left; }
    #reporteContenido th { background-color: #f7fafc; color: #2d3748; }
  </style>
</head>
<body>

<div class="card">
  <div class="header-title">
    <h2>Prepara tu auditoría</h2>
    <p>Carga los documentos requeridos y obtén un informe técnico-pedagógico para apoyar la mejora de tu evaluación.</p>
  </div>

  <div class="input-group">
    <label class="input-label" for="apiKey">Clave API de Gemini:</label>
    <div class="api-input-wrapper">
      <input type="password" id="apiKey" placeholder="Pega aquí tu API Key de Google AI Studio">
      <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility()">👁️</button>
    </div>
  </div>

  <div class="grid-files">
    <div class="file-box">
      <label>Tabla de Especificaciones</label>
      <div class="sub">Selecciona el PDF con objetivos, habilidades, contenidos e ítems.</div>
      <input type="file" id="tablaPdf" accept="application/pdf">
    </div>

    <div class="file-box">
      <label>Evaluación o Prueba</label>
      <div class="sub">Selecciona el PDF del instrumento que deseas revisar.</div>
      <input type="file" id="pruebaPdf" accept="application/pdf">
    </div>
  </div>

  <div id="errorBox"></div>

  <button class="btn-main" id="btnAnalizar" onclick="ejecutarAuditoria()">
    ✨ Auditar evaluación pedagógica
  </button>

  <div id="loader">
    <span id="loaderText">Auditando evaluación pedagógica...</span>
  </div>

  <div id="results">
    <div class="action-bar">
      <button class="btn-download" onclick="descargarInformePDF()">
        📥 Descargar Informe PDF
      </button>
    </div>
    <div id="reporteContenido"></div>
  </div>
</div>

<script>
  function togglePasswordVisibility() {
    const input = document.getElementById('apiKey');
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });
  }

  // Función para convertir el reporte HTML a un archivo PDF descargable
  function descargarInformePDF() {
    const elemento = document.getElementById('reporteContenido');
    if (!elemento || !elemento.innerText.trim()) return;

    const opciones = {
      margin:       [12, 12, 12, 12],
      filename:     'Informe_Auditoria_Pedagogica_UTP.pdf',
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, useCORS: true },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(opciones).from(elemento).save();
  }

  async function ejecutarAuditoria() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const tablaFile = document.getElementById('tablaPdf').files[0];
    const pruebaFile = document.getElementById('pruebaPdf').files[0];
    const errorBox = document.getElementById('errorBox');

    errorBox.style.display = 'none';

    if (!apiKey || !tablaFile || !pruebaFile) {
      errorBox.innerText = 'Por favor ingresa la clave API y adjunta ambos documentos en PDF.';
      errorBox.style.display = 'block';
      return;
    }

    document.getElementById('btnAnalizar').disabled = true;
    document.getElementById('loader').style.display = 'block';
    document.getElementById('results').style.display = 'none';

    try {
      const tablaB64 = await fileToBase64(tablaFile);
      const pruebaB64 = await fileToBase64(pruebaFile);

      const MODEL = 'gemini-3.8-flash';
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: "Realiza una auditoría pedagógica técnica de la Tabla de Especificaciones y la Evaluación adjuntas considerando la normativa de máximo 3 OAs y 3 Habilidades, cruzándolas con el Marco para la Buena Enseñanza (MBE). Incluye retroalimentación formativa para el docente." },
              { inline_data: { mime_type: "application/pdf", data: tablaB64 } },
              { inline_data: { mime_type: "application/pdf", data: pruebaB64 } }
            ]
          }]
        })
      });

      const data = await response.json();

      if (!response.ok || data.error) {
        throw new Error(data.error ? data.error.message : 'Error en la consulta');
      }

      const textoResultado = data.candidates[0].content.parts[0].text;
      document.getElementById('reporteContenido').innerHTML = marked.parse(textoResultado);
      document.getElementById('results').style.display = 'block';

    } catch (err) {
      errorBox.innerText = 'No fue posible completar la auditoría: ' + err.message;
      errorBox.style.display = 'block';
    } finally {
      document.getElementById('btnAnalizar').disabled = false;
      document.getElementById('loader').style.display = 'none';
    }
  }
</script>
</body>
</html>
